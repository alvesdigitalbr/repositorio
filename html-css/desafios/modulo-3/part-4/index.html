<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
table {
    border-collapse: collapse;
    width: 50%;
}
thead th {
    border: 1px solid black;
    border-bottom: none;
    padding: 5px;
    text-align: center;
    background-color: lightgray;
    font-size: 20px;
}
tbody th {
    border: 1px solid black;
    border-right: none;
    padding: 5px;
    text-align: center;
    background-color: lightgray;
    font-size: 20px;
}
tbody td {
    border: 1px solid black;
    padding: 5px;
    text-align: center;
    font-size: 20px;
}
.total {
    background-color: lightgray;
}
.media {
    text-align: left;
    padding-left: 15%;
}

    </style>
</head>
<body>
    <table>
        <colgroup>
            <col>
            <col style="background-color: lightblue;">
            <col style="background-color: rgba(128, 128, 128, 0.450);">
            <col style="background-color: rgba(128, 128, 128, 0.6);">
        </colgroup>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Área</th>
                <th scope="col" rowspan="2">Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas</th>
                
                <th scope="col" rowspan="2">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Bioologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" colspan="4" class="media">Média de Exatas</th>
                <td class="total">0.0</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="2">Humanas</th>
                <td>Hístoria</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>   
                <td>0.0</td>   
                <td>0.0</td>   
                <td>0.0</td>   
            </tr>
            <tr>
                <th scope="colgroup" colspan="4" class="media">Média de Humanas</th>
                <td class="total">0.0</td>
            </tr>

        </tbody>
    </table>
</body>
</html>
