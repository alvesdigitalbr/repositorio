<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form responsive</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/medium-screens.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hcontainer">
        <div class="hlogo">
            <a href="https://github.com/alvesdigitalbr" target="_blank" aria-label="Acessar perfil do desenvolvedor no GitHub">
                <img src="../images/logo-46.png" alt="Logo Alves">
            </a>
        </div>
    </header>
    <main class="mcontainer">
        <section class="form-section">
            <div class="area-image">
                <img src="../images/predio-hero.jpg" alt="imagem de um prédio marrom, com janelas olhado de baixo">
            </div>
            <div class="area-login">
                <h1>TaskFlow</h1>
                <p>Faça login para continuar de onde parou e transformar suas ideias em resultados.</p>
                <form action="login.php" autocomplete="on" method="post" class="area-cadastro">
                    <div class="login-group">
                        <label for="ilogin">Email:</label>
                        <input type="email" name="nlogin" id="ilogin" placeholder="e-mail" required size="40" autocomplete="email">
                    </div>
                    <div class="login-group">
                        <label for="ipassword">Senha:</label>
                        <input type="password" name="npassword" id="ipassword" placeholder="Senha" required minlength="6" autocomplete="current-password">
                    </div>
                    <input type="submit" value="Enviar" class="insubmit">
                    <p>Ainda não tem uma conta? <a href="#">Cadastre-se</a> gratuitamente.</p>
                    <p>Ao continuar, você concorda com nossos <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>.</p>
                    
                </form>
            </div>
        </section>
        
    </main>
</body>
</html>
